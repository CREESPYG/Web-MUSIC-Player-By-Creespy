<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#162032" />
      <stop offset="100%" stop-color="#040913" />
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Vinyl Disc Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
  <!-- Pulsing Ripple -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neon)" stroke-width="6" stroke-dasharray="16 28" filter="url(#glow)" />
  <!-- Vinyl Center Disc -->
  <circle cx="256" cy="256" r="64" fill="url(#neon)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="20" fill="#040913" />
  <!-- Musical Note Silhouette -->
  <path d="M250 216 v48 a20 20 0 1 1 -14 -19 v-45 l36 -10 v22 z" fill="#ffffff" />
</svg>
